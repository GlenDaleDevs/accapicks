<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Net pattern definition -->
  <defs>
    <pattern id="net" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="16" y2="16" stroke="white" stroke-width="0.5" />
      <line x1="16" y1="0" x2="0" y2="16" stroke="white" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- Net fill -->
  <rect x="61" y="31" width="278" height="138" fill="url(#net)" />

  <!-- Goalpost frame -->
  <!-- Left post -->
  <rect x="60" y="30" width="4" height="140" fill="white" />

  <!-- Right post -->
  <rect x="336" y="30" width="4" height="140" fill="white" />

  <!-- Crossbar -->
  <rect x="60" y="30" width="280" height="4" fill="white" />

  <!-- Ground line (base of goal) -->
  <rect x="60" y="166" width="280" height="4" fill="white" />
</svg>
