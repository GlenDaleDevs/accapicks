<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Build accumulators with your mates, compare bookmakers, and climb the leaderboard." />
    <meta name="theme-color" content="#0B3246" />

    <!-- Open Graph tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://accapicks.com" />
    <meta property="og:title" content="AccaPicks — One group. One acca. Bragging rights." />
    <meta property="og:description" content="The acca tracker for your group chat. Build accumulators with your mates, compare bookmakers, and climb the leaderboard." />
    <meta property="og:image" content="https://accapicks.com/og-image.png" />

    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AccaPicks — One group. One acca. Bragging rights." />
    <meta name="twitter:description" content="The acca tracker for your group chat. Build accumulators with your mates, compare bookmakers, and climb the leaderboard." />
    <meta name="twitter:image" content="https://accapicks.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>AccaPicks — The acca tracker for your group chat</title>
  </head>
  <body>
    <style>
      #splash{position:fixed;inset:0;z-index:9999;flex-direction:column;align-items:center;justify-content:center;background:#0B3246;transition:opacity 0.5s ease-out;display:none}
      @media(display-mode:standalone){#splash{display:flex}}
      @keyframes splash-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
      #splash img{animation:splash-pulse 1.8s ease-in-out infinite}
    </style>
    <div id="splash">
      <img src="/logo.png" alt="" width="240" height="240" />
      <div style="color:#fff;font-family:Inter,system-ui,sans-serif;text-align:center;margin-top:16px;">
        <div style="font-size:22px;font-weight:700;letter-spacing:-0.5px;">AccaPicks</div>
        <div style="font-size:13px;font-weight:400;opacity:0.6;margin-top:4px;">The acca tracker for your group chat</div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Chrome can fire beforeinstallprompt before React mounts — stash it so
      // InstallPrompt can still offer the native install dialog
      window.__installPromptEvent = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__installPromptEvent = e;
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
